x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: "dGVzdC1mZXJuZXQta2V5LWZvci1kZW1vLXVzZS1vbmx5LTE="
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: deals_bigdata
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ""
    CLICKHOUSE_DB: deals_mart
    AS_OF: ${AS_OF:-2026-10-26}
    ETL_START_DATE: ${ETL_START_DATE:-2023-06-01}
    ETL_END_DATE: ${ETL_END_DATE:-2027-03-31}
    RANDOM_SEED: ${RANDOM_SEED:-42}
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
    - ./data/models:/opt/airflow/project/data/models
  user: "${AIRFLOW_UID:-0}:0"
  depends_on:
    postgres:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deals_bigdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deals_bigdata"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./docker/clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    image: postgres:17
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: deals_bigdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      N_PRICES: ${N_PRICES:-50000}
    volumes:
      - ./sql:/sql:ro
      - ./docker/init-with-psql.sh:/init-with-psql.sh:ro
    entrypoint: ["/bin/bash", "/init-with-psql.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: deals_bigdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DB: deals_mart
      AS_OF: ${AS_OF:-2026-10-26}
      ETL_START_DATE: ${ETL_START_DATE:-2023-06-01}
      ETL_END_DATE: ${ETL_END_DATE:-2027-03-31}
      RANDOM_SEED: ${RANDOM_SEED:-42}
    volumes:
      - ./data/models:/app/data/models
    depends_on:
      db-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username $${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    user: "0:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      pipeline:
        condition: service_started

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      pipeline:
        condition: service_started

volumes:
  pgdata:
  chdata: